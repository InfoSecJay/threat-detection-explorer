name: CI

# Gates that previously ran only on developer machines (#45): the
# backend pytest suite, and the frontend typecheck / lint / vitest.
# Deploys are unaffected -- Railway and Vercel build from their own
# triggers -- so this is purely a merge signal.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q --no-header -p no:cacheprovider

  frontend:
    name: Frontend (tsc, lint, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the npm major the lockfile is written with (npm 11 /
          # Node 24 locally). npm 10 reads the same lock as out of sync
          # ("Missing: esbuild@0.28.2 from lock file") and npm ci refuses.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
