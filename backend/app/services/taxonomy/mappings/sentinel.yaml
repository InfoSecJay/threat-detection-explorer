# Per-dataType overrides. SecurityAlert is a generic table that any
# connector can produce, so detecting it at the data_type level lets us
# add the `siem_alert` data_source signal even when the connectorId is
# something we don't have a specific mapping for yet.
data_types:
  securityalert:
    data_sources: [siem_alert]
    event_types: [audit_event]
  awssecurityhubfindings:
    data_sources: [aws_security_hub]
    event_types: [audit_event]
  azureactivity:
    data_sources: [azure_activity]
    event_types: [api_call]
  signinlogs:
    data_sources: [entra_id_signin]
    event_types: [authentication]
  auditlogs:
    data_sources: [entra_id_audit]
    event_types: [audit_event]
  officeactivity:
    data_sources: [m365_audit]
    event_types: [audit_event]
  commonsecuritylog:  # CEF data pipe — usually firewall/proxy/NDR
    platforms: [network_appliance]
    event_types: [network_connection]
  azurediagnostics:  # Azure resource diagnostic logs
    platforms: [azure]
    data_sources: [azure_activity]
    event_types: [api_call]
  dataverseactivity:
    platforms: [microsoft_365]
    data_sources: [m365_audit]
    event_types: [audit_event]

# ─────────────────────────────────────────────────────────────────────────
# TIER 4 — SOLUTIONS FOLDER NAMES (vendor fallback)
# When `requiredDataConnectors` is missing and the KQL table didn't
# resolve, the `Solutions/<vendor>/` folder is an authoritative vendor
# signal. Kept lowercase for case-insensitive lookup. Only the top
# unmapped folders are listed here; long-tail vendors (single-rule
# folders) fall through to the `*_cl` table bucket.
# ─────────────────────────────────────────────────────────────────────────
solution_folders:
  # ── Acronis ─────────────────────────────────────────────────────────
  "acronis cyber protect cloud":
    platforms: [cross_platform]
    data_sources: [antivirus_logs]
    event_types: [audit_event]
  # ── Azure DevOps ────────────────────────────────────────────────────
  "azuredevopsauditing":
    platforms: [cross_platform]
    data_sources: [application_logs]
    event_types: [audit_event]
  # ── CTERA (edge filers) ─────────────────────────────────────────────
  "ctera":
    platforms: [cross_platform]
