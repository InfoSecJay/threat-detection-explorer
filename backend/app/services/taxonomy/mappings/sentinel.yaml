  gcp_audit_logs:
    platforms: [gcp]
    data_sources: [gcp_audit]
    event_types: [api_call]
  # ── SIEM alert streams (Sentinel's own + external) ───────────────────
  # SecurityAlert is Sentinel's central alert table. Sources include
  # Defender for Endpoint (windows), Defender for Cloud (azure),
  # Defender for Cloud Apps + M365 Defender + Defender for Identity
  # (microsoft_365). AWS Security Hub findings can land here too via
  # connector but the overwhelmingly common case is Microsoft.
  securityalert:
    # Sentinel's central alert table: the product behind an alert is the
    # ProviderName discriminator (MDATP, IoTSecurity ...). No platform is
    # asserted by default; three Microsoft platforms used to be (#141).
    generic: true
    platforms: []
    data_sources: [siem_alert]
    event_types: [audit_event]
  securityincident:
    generic: true
    platforms: []
    data_sources: [siem_alert]
    event_types: [alert_correlation]
  # Defender for Cloud security recommendations (Azure-resident).
  securitynestedrecommendation:
    platforms: [azure]
    data_sources: [siem_alert]
    event_types: [audit_event]
  # Sentinel UEBA -- analyzes Entra / SecurityEvent / signinlogs data
  # but the table itself is an Azure-resident feature.
  behavioranalytics:
    platforms: [azure]
    data_sources: [siem_alert]
    event_types: [audit_event]
  # Sentinel ML anomalies -- Azure-resident detection service.
  anomalies:
    platforms: [azure]
    data_sources: [siem_alert]
    event_types: [audit_event]
  # ── Threat intelligence ──────────────────────────────────────────────
  # MS Sentinel TI / MDTI ingest -- Azure-resident table. Describes
  # IOCs that apply to many platforms; the table itself lives in Azure.
  threatintelligenceindicator:
    platforms: [azure]
    data_sources: [siem_alert]
    event_types: [audit_event]
  threatintelindicators:
    platforms: [azure]
    data_sources: [siem_alert]
    event_types: [audit_event]
