    event_types: [audit_event]
  # ── Azure Monitor Agent (AMA) ingest connectors ──────────────────────
  # SyslogAMA is Linux syslog pulled in via Azure Monitor Agent — volume
  # is high (83 rules) because many third-party appliances fall back to
  # syslog when a native CEF/OCSF path doesn't exist.
  syslogama:
    platforms: [linux]
    data_sources: [linux_syslog]
    event_types: [audit_event]
  # CEF via AMA goes to the `CommonSecurityLog` table — dataType mapping
  # below carries the real telemetry signal.
  cefama:
    platforms: [network_appliance]
    data_sources: [palo_alto_firewall, fortinet_firewall, cisco_firewall]
    event_types: [network_connection]
  # Custom Logs via AMA is the catch-all for any custom-schema ingestion.
  # We don't know the shape, so cross_platform / application_logs.
  customlogsama:
    platforms: [cross_platform]
    data_sources: [application_logs]
    event_types: [audit_event]
