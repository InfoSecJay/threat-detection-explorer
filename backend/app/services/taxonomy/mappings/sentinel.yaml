# Microsoft Sentinel → canonical taxonomy mappings.
#
# Five tiers, resolved in order (see vendors/sentinel.py for full docs):
#   1. kql_tables       — first KQL table the rule queries (authoritative)
#   2. connectors       — `requiredDataConnectors[].connectorId`
#   3. data_types       — `requiredDataConnectors[].dataTypes[]`
#   4. solution_folders — `Solutions/<vendor>/` vendor fallback
#   5. entity_types     — `entityMappings[].entityType` last-resort hint
#
# Keys are lowercase. Tier 1 is the dominant signal; every Sentinel
# rule starts with a table. Tier 4 covers the long tail of third-party
# vendors from the Marketplace that don't declare requiredDataConnectors.

# ─────────────────────────────────────────────────────────────────────────
# TIER 1 — KQL TABLE NAMES (authoritative event_type)
# The first table referenced at the head of the query. This is the
# most reliable data-source signal we have. `*_cl` catches any vendor
# custom log; specific `_CL` tables (e.g. BHEAttackPathsData_CL) can be
# listed explicitly if more precision is wanted.
# ─────────────────────────────────────────────────────────────────────────
