    platforms: [windows]
    data_sources: [windows_security_event_log]
    event_types: [audit_event]
  # ── FalconFriday (CrowdStrike) ──────────────────────────────────────
  "falconfriday":
    platforms: [windows, linux, macos]
    data_sources: [crowdstrike_fdr]
  # ── Azure Activity ──────────────────────────────────────────────────
  "azure activity":
    platforms: [azure]
    data_sources: [azure_activity]
    event_types: [api_call]
  # ── SAP BTP ─────────────────────────────────────────────────────────
  "sap btp":
    platforms: [cross_platform]
    data_sources: [application_logs]
    event_types: [audit_event]
  # ── IoT / OT ────────────────────────────────────────────────────────
  "iotottreatmonitoringwithdefenderforiot":
    platforms: [cross_platform]
    data_sources: [defender_cloud]
    event_types: [audit_event]

# ─────────────────────────────────────────────────────────────────────────
# TIER 5 — ENTITY TYPES (last-resort event_type hint)
# Only consulted when no higher tier set any event_type. Entity types
# describe what the rule RETURNS, not where data comes from — so we
# never let them set platforms or data_sources.
# ─────────────────────────────────────────────────────────────────────────
entity_types:
  mailmessage:
    event_types: [email_message]
  mailbox:
    event_types: [email_message]
  process:
    event_types: [process_creation]
  file:
    event_types: [file_event]
  filehash:
    event_types: [file_event]
  account:
    event_types: [authentication]
  registrykey:
    event_types: [registry_event]
  registryvalue:
    event_types: [registry_event]
  ip:
    event_types: [network_connection]
  dnsresolution:
    event_types: [dns_query]
  url:
    event_types: [http_request]

# Sentinel rules are SIEM correlation queries by definition — every rule
# is examining audit/api activity at minimum.
always_includes:
  event_types: []
