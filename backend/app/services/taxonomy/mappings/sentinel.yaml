    generic: true
    platforms: [windows]
    data_sources: [windows_event_logs]
    event_types: [audit_event]
  windowsfirewall:
    platforms: [windows]
    data_sources: [windows_security_event_log]
    event_types: [network_connection]
  syslog:
    # Shared by Linux daemons and every appliance that ships syslog. A
    # ProcessName discriminator (sshd, sudo ...) confirms Linux; an
    # appliance solution folder names the vendor; else this fallback.
    generic: true
    platforms: [linux]
    data_sources: [linux_syslog]
    event_types: [audit_event]
  # ── CEF / Azure Monitor Agent ingest ─────────────────────────────────
  commonsecuritylog:
    # CEF pipe shared by every vendor that speaks CEF. The vendor comes
    # from the query (DeviceVendor / DeviceProduct discriminators) or the
    # solution folder; this entry is only the generic fallback (#141).
    generic: true
