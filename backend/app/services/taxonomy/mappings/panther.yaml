# Panther Labs `panther-analysis` -> canonical taxonomy mappings.
#
# Every Panther rule declares one or more `LogTypes:` (e.g.
# `AWS.CloudTrail`, `Okta.SystemLog`, `Notion.AuditLogs`). The vendor
# resolver in `vendors/panther.py` looks each up here and UNIONS the
# result — a multi-LogType rule like
#   LogTypes: [OneLogin.Events, AWS.CloudTrail, Zoom.Operation]
# resolves to platforms=[aws, onelogin, zoom],
# data_sources=[aws_cloudtrail, onelogin_events, zoom_operation],
# and the union of event_types.
#
# 100% coverage of all LogTypes observed in the 2026-08 corpus recon.
# Prefix-based fallbacks in the resolver catch new subtypes in known
# families (e.g. a future `PushSecurity.NewSubtype` still resolves to
# push_security_audit). If Panther adds a NEW top-level family, the
# audit script (audit_normalization.py) surfaces the `[unknown]`
# fallout and we add a new entry here.

