    platforms: [linux]
    data_sources: [auditd]
  "auditbeat-*":
    platforms: [linux]
    data_sources: [auditd]

  # ═══════════════════════════════════════════════════════════════════════
  # AWS
  # ═══════════════════════════════════════════════════════════════════════
  "logs-aws.cloudtrail*":
    platforms: [aws]
    data_sources: [aws_cloudtrail]
    event_types: [api_call]
  "logs-aws.guardduty*":
    platforms: [aws]
    data_sources: [aws_guardduty]
    event_types: [audit_event]
  "logs-aws.securityhub*":
    platforms: [aws]
    data_sources: [aws_security_hub]
    event_types: [audit_event]
  "logs-aws.vpcflow*":
    platforms: [aws]
    data_sources: [aws_vpc_flow]
    event_types: [network_connection]
  "logs-aws*":
    platforms: [aws]
    data_sources: [aws_cloudtrail]
    event_types: [api_call]
  # NOTE: `filebeat-*` is intentionally NOT mapped. It's Elastic's generic
  # log-file shipper and carries anything (syslog, nginx, app logs, etc.).
  # A prior mapping pointed it at aws_cloudtrail, which caused network
  # rules (packetbeat + filebeat + logs-network_traffic.*) to bleed into
  # the AWS bucket. Rules that list only `filebeat-*` stay UNKNOWN —
  # honest over wrong.

  # ── IBM QRadar (external SIEM connector) ─────────────────────────────
  "logs-ibm_qradar.offense-*":
    platforms: [cross_platform]
    data_sources: [siem_alert]
    event_types: [alert_correlation]

  # ═══════════════════════════════════════════════════════════════════════
  # HIGHER-ORDER RULES (alert-on-alert correlations)
  # ESQL rules that consume `.alerts-security-*` are correlating already-
  # fired alerts — Elastic calls these "higher-order" rules. The input
  # isn't raw telemetry; it's detected activity.
  # ═══════════════════════════════════════════════════════════════════════
  # Higher-order rules query the SIEM's own alert stream. Platform is
  # `cross_platform` because the SIEM sits across all telemetry sources —
  # an alert-on-alert rule may correlate alerts from Windows, Linux,
  # cloud, etc. Without this the rules show platforms=[unknown].
  ".alerts-security.alerts-*":
    platforms: [cross_platform]
    data_sources: [elastic_siem_alerts]
    event_types: [alert_correlation]
  ".alerts-security*":
    platforms: [cross_platform]
    data_sources: [elastic_siem_alerts]
    event_types: [alert_correlation]
  ".alerts-*":
    platforms: [cross_platform]
    data_sources: [elastic_siem_alerts]
    event_types: [alert_correlation]

  # ═══════════════════════════════════════════════════════════════════════
  # AZURE (all services → platform=azure, precision via data_source)
