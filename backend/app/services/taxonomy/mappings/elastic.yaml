# Elastic Detection Rules -> canonical taxonomy mappings.
#
# Based on a catalog of 1,705 rules with 47 unique integrations and
# 82 unique index patterns. Two signals:
#   1. `index` patterns (most reliable, fine-grained) — matched first
#   2. `integration` plugins (coarse, used as fallback)
#
# A single rule can span many indices (Elastic's cross-platform rules
# often list 6+ index patterns); the resolver unions across all matches.
#
# Design: same "no inference" + "full granularity" principles as sigma.yaml.
# Platform is `azure` everywhere (consolidated from azure + azure_ad).

