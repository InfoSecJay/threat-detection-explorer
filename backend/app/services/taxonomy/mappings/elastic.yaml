    platforms: [windows]
    data_sources: [windows_security_event_log]
    event_types: [audit_event]
  "logs-system.system*":
    platforms: [windows]
    data_sources: [windows_security_event_log]
    event_types: [audit_event]
  "logs-system.application*":
    platforms: [windows]
    data_sources: [windows_security_event_log]
    event_types: [audit_event]
  "logs-system.auth*":
    platforms: [linux]
    data_sources: [linux_syslog]
    event_types: [authentication]
  "logs-system.syslog*":
    platforms: [linux]
    data_sources: [linux_syslog]
    event_types: [audit_event]

  # ═══════════════════════════════════════════════════════════════════════
  # LINUX / AUDITD
  # ═══════════════════════════════════════════════════════════════════════
