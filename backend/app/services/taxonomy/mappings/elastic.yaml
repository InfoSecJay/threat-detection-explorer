  "traces-apm*":
    platforms: [cross_platform]
    data_sources: [application_logs]
    event_types: [audit_event]
  # Elastic's own SIEM alert stream (higher-order rules consume this).
  # The specific pattern `.alerts-security*` is already mapped above —
  # re-listing `.alerts-security.*` here would silently override it
  # with a different semantics, so we route it to the same canonical
  # values (elastic_siem_alerts + alert_correlation).
  ".alerts-security.*":
    data_sources: [elastic_siem_alerts]
    event_types: [alert_correlation]
  # External SIEM alert streams being ingested into Elastic (Elastic
  # Security from a different cluster, Google SecOps, etc.). These are
  # `platform_alert` inputs, NOT alert_correlation (which is reserved
  # for the SIEM consuming its OWN alert stream).
  "logs-elastic_security.alert*":
    platforms: [cross_platform]
    data_sources: [siem_alert]
    event_types: [platform_alert]
  "logs-google_secops.alert*":
    platforms: [cross_platform]
    data_sources: [siem_alert]
    event_types: [platform_alert]
  "logs-microsoft_sentinel.alert*":
