# Elastic Detection Rules -> canonical taxonomy mappings.
#
# Based on a catalog of 1,705 rules with 47 unique integrations and
# 82 unique index patterns. Two signals:
#   1. `index` patterns (most reliable, fine-grained) — matched first
#   2. `integration` plugins (coarse, used as fallback)
#
# A single rule can span many indices (Elastic's cross-platform rules
# often list 6+ index patterns); the resolver unions across all matches.
#
# Design: same "no inference" + "full granularity" principles as sigma.yaml.
# Platform is `azure` everywhere (consolidated from azure + azure_ad).

index_patterns:
  # ═══════════════════════════════════════════════════════════════════════
  # ELASTIC DEFEND (endpoint agent)
  # ═══════════════════════════════════════════════════════════════════════
  "logs-endpoint.events.process-*":
    platforms: [windows, linux, macos]
    data_sources: [elastic_defend]
    event_types: [process_creation]
  "logs-endpoint.events.file-*":
    platforms: [windows, linux, macos]
    data_sources: [elastic_defend]
    event_types: [file_event]
  "logs-endpoint.events.network-*":
    platforms: [windows, linux, macos]
    data_sources: [elastic_defend]
    event_types: [network_connection]
  "logs-endpoint.events.registry-*":
    platforms: [windows]
    data_sources: [elastic_defend]
    event_types: [registry_event]
  "logs-endpoint.events.library-*":
    platforms: [windows, linux, macos]
    data_sources: [elastic_defend]
    event_types: [image_load]
  "logs-endpoint.events.dns-*":
    platforms: [windows, linux, macos]
    data_sources: [elastic_defend]
    event_types: [dns_query]
  "logs-endpoint.events.api-*":
    platforms: [windows, linux, macos]
    data_sources: [elastic_defend]
    event_types: [api_call]
  "logs-endpoint.events.device-*":
    platforms: [windows, linux, macos]
    data_sources: [elastic_defend]
    event_types: [audit_event]
  "logs-endpoint.events.*":
    platforms: [windows, linux, macos]
    data_sources: [elastic_defend]
  "logs-endpoint.alerts-*":
    platforms: [windows, linux, macos]
    data_sources: [elastic_defend]
    event_types: [audit_event]
  "logs-endpoint.*":
    platforms: [windows, linux, macos]
    data_sources: [elastic_defend]
  "endgame-*":
    platforms: [windows, linux, macos]
    data_sources: [elastic_endgame]

  # ═══════════════════════════════════════════════════════════════════════
  # CLOUD DEFEND (Elastic container/K8s security agent)
  # ═══════════════════════════════════════════════════════════════════════
  "logs-cloud_defend.process*":
    platforms: [kubernetes]
    data_sources: [cloud_defend]
    event_types: [process_creation]
  "logs-cloud_defend.file*":
    platforms: [kubernetes]
    data_sources: [cloud_defend]
    event_types: [file_event]
  "logs-cloud_defend.alerts-*":
    platforms: [kubernetes]
    data_sources: [cloud_defend]
    event_types: [audit_event]
  "logs-cloud_defend*":
    platforms: [kubernetes]
    data_sources: [cloud_defend]

  # ═══════════════════════════════════════════════════════════════════════
  # WINDOWS EVENT LOGS (multi-source)
  # ═══════════════════════════════════════════════════════════════════════
  "logs-windows.sysmon_operational-*":
    platforms: [windows]
    data_sources: [sysmon]
  "logs-windows.powershell*":
    platforms: [windows]
    data_sources: [windows_powershell]
    event_types: [process_creation]
  "logs-windows.forwarded*":
    platforms: [windows]
    data_sources: [windows_security_event_log]
    event_types: [audit_event]
  "logs-windows.*":
    platforms: [windows]
    data_sources: [windows_security_event_log]
  "winlogbeat-*":
    platforms: [windows]
    data_sources: [windows_security_event_log]
    event_types: [audit_event]

  # ═══════════════════════════════════════════════════════════════════════
  # SYSTEM LOGS
  # ═══════════════════════════════════════════════════════════════════════
