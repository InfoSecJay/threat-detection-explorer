# Per-event-ID taxonomy dictionary (issue #16).
#
# Second-pass refinement on top of the logsource-based classification in
# the vendor mapping files. A rule whose logsource is a coarse channel
# (Sigma `windows/security`, Sentinel `SecurityEvent`, Splunk
# "Windows Event Log Security ...") gets `event_types: [audit_event]`
# from the vendor mapping; when the rule ALSO pins specific event IDs,
# this dictionary says what those IDs actually are so the rule can be
# reclassified (4624 -> authentication, 4688 -> process_creation, ...).
#
# Rules:
# - One entry per event ID across ALL providers. IDs are looked up by
#   number alone (the extractor does not know the channel), so an ID
#   that means different things in different channels must NOT be
#   listed. Known collisions deliberately excluded: 8001-8004 (NTLM
#   audit vs AppLocker EXE/DLL) and the rest of AppLocker (8005-8025).
#   `tests/test_services/test_event_ids.py` fails on duplicates.
# - `event_types` values must be canonical (`taxonomy/canonical.py`).
# - `label` is the short human name shown in the UI next to the ID.
#   ASCII only.
# - Only Windows providers today. The refinement pass is gated on the
#   rule being Windows-scoped (platform or data source), so a Linux rule
#   with `type=1` never picks up a Sysmon meaning.
#
# References:
#   https://learn.microsoft.com/windows/security/threat-protection/auditing/
#   https://learn.microsoft.com/sysinternals/downloads/sysmon
version: 1
providers:
  windows_security:
    channel: Security
