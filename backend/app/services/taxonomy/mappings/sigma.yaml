    data_sources: [sysmon, windows_security_event_log]
    event_types: [process_creation]
  windows/process_termination:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [process_termination]
  windows/process_access:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [process_access]
  windows/create_remote_thread:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [create_remote_thread]
  windows/raw_access_thread:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [raw_access_thread]
  windows/process_tampering:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [process_tampering]
  windows/image_load:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [image_load]
  windows/driver_load:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [driver_load]

  # File activity
  windows/file_event:
    platforms: [windows]
    data_sources: [sysmon, windows_security_event_log]
    event_types: [file_event]
  windows/file_change:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [file_change]
  windows/file_delete:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [file_delete]
  windows/file_delete_detected:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [file_delete_detected]
  windows/file_block_executable:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [file_block_executable]
  windows/file_block_shredding:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [file_block_shredding]
  windows/file_executable_detected:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [file_executable_detected]
  windows/create_stream_hash:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [create_stream_hash]
  windows/pipe_created:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [pipe_created]

  # Registry activity
  windows/registry_event:
    platforms: [windows]
    data_sources: [sysmon, windows_security_event_log]
    event_types: [registry_event]
  windows/registry_add:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [registry_add]
  windows/registry_delete:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [registry_delete]
  windows/registry_set:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [registry_set]
  windows/registry_rename:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [registry_rename]

  # Network activity
  windows/network_connection:
    platforms: [windows]
    data_sources: [sysmon, windows_security_event_log]
    event_types: [network_connection]
  windows/dns_query:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [dns_query]

  # Sysmon misc
  windows/wmi_event:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [wmi_event]
  windows/clipboard_capture:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [clipboard_capture]
  windows/sysmon_status:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [sysmon_status]
  windows/sysmon_error:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [sysmon_error]

  # ───────────────────────────────────────────────────────────────────────
  # Windows — channel-level logsources (no Sigma category provided).
  # All get blanket `audit_event` until we build a per-EventID dictionary
  # (see TODO: "Windows Security Event Code dictionary").
  # ───────────────────────────────────────────────────────────────────────
  windows/security:
    platforms: [windows]
    data_sources: [windows_security_event_log]
    event_types: [audit_event]
  windows/system:
    platforms: [windows]
    data_sources: [windows_security_event_log]
    event_types: [audit_event]
  windows/application:
    platforms: [windows]
    data_sources: [windows_security_event_log]
    event_types: [audit_event]
  windows/sysmon:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [audit_event]
  windows/powershell:
    platforms: [windows]
    data_sources: [windows_powershell]
    event_types: [audit_event]
  windows/ps_classic_start:
    platforms: [windows]
    data_sources: [windows_powershell]
    event_types: [audit_event]
  windows/ps_module:
    platforms: [windows]
    data_sources: [windows_powershell]
    event_types: [audit_event]
  windows/ps_script:
    platforms: [windows]
    data_sources: [windows_powershell]
    event_types: [audit_event]
  windows/dns-server:
    platforms: [windows]
    data_sources: [windows_security_event_log]
    event_types: [audit_event]
  windows/firewall-as:
    platforms: [windows]
    data_sources: [windows_security_event_log]
    event_types: [audit_event]
  windows/defender:
    platforms: [windows]
    data_sources: [windows_defender_event_log]
    event_types: [audit_event]
  windows:
    platforms: [windows]
    data_sources: [windows_security_event_log]
    # event_types intentionally omitted — too broad without explicit
    # category or service hint. Resolver falls back to [unknown].

  # ───────────────────────────────────────────────────────────────────────
  # Linux
  # ───────────────────────────────────────────────────────────────────────
  linux/auditd/execve:
    platforms: [linux]
    data_sources: [auditd]
    event_types: [process_creation]
  linux/auditd:
    platforms: [linux]
    data_sources: [auditd]
    event_types: [audit_event]
  linux/process_creation:
    platforms: [linux]
    data_sources: [auditd, osquery]
    event_types: [process_creation]
  linux/file_event:
    platforms: [linux]
    data_sources: [auditd]
    event_types: [file_event]
  linux/network_connection:
    platforms: [linux]
    data_sources: [auditd, zeek]
    event_types: [network_connection]
  linux/syslog:
    platforms: [linux]
    data_sources: [linux_syslog]
    event_types: [audit_event]
  linux:
    platforms: [linux]
    data_sources: [linux_syslog]

  # ───────────────────────────────────────────────────────────────────────
  # macOS
  # ───────────────────────────────────────────────────────────────────────
  macos/process_creation:
    platforms: [macos]
    data_sources: [osquery]
    event_types: [process_creation]
  macos/file_event:
    platforms: [macos]
    data_sources: [osquery]
    event_types: [file_event]
  macos:
    platforms: [macos]
    data_sources: [osquery]

  # ───────────────────────────────────────────────────────────────────────
  # Cloud API logs — api_call because they're all REST-API event streams
  # ───────────────────────────────────────────────────────────────────────
  aws/cloudtrail:
    platforms: [aws]
    data_sources: [aws_cloudtrail]
    event_types: [api_call]
  aws:
    platforms: [aws]
    data_sources: [aws_cloudtrail]
    event_types: [api_call]
  azure/activitylogs:
    platforms: [azure]
    data_sources: [azure_activity]
    event_types: [api_call]
  azure/azureactivity:
    platforms: [azure]
    data_sources: [azure_activity]
    event_types: [api_call]
  # ── Azure sign-in is authentication (explicitly a sign-in event feed)
  azure/signinlogs:
    platforms: [azure_ad]
    data_sources: [entra_id_signin]
    event_types: [authentication]
  # ── Azure audit logs are API-level admin events
  azure/auditlogs:
    platforms: [azure_ad]
    data_sources: [entra_id_audit]
    event_types: [api_call]
  # ── M365 Defender — alert-level feed, not raw API calls
  azure/m365defender:
    platforms: [microsoft_365]
    data_sources: [defender_endpoint]
    event_types: [audit_event]
  azure:
    platforms: [azure]
    data_sources: [azure_activity]

  # Microsoft 365 — all treated as api_call (M365 Unified Audit is REST API)
  m365/threat_management:
    platforms: [microsoft_365]
    data_sources: [m365_audit]
    event_types: [api_call]
  m365/exchange:
    platforms: [microsoft_365]
    data_sources: [m365_exchange_audit]
    event_types: [api_call]
  m365:
    platforms: [microsoft_365]
    data_sources: [m365_audit]
    event_types: [api_call]

  # GCP
  gcp/google_workspace.admin:
    platforms: [google_workspace]
    data_sources: [google_workspace_audit]
    event_types: [api_call]
  gcp/gcp.audit:
    platforms: [gcp]
    data_sources: [gcp_audit]
    event_types: [api_call]
  gcp:
    platforms: [gcp]
    data_sources: [gcp_audit]
    event_types: [api_call]
  google_workspace:
    platforms: [google_workspace]
    data_sources: [google_workspace_audit]
    event_types: [api_call]

  # ───────────────────────────────────────────────────────────────────────
  # Identity / SaaS — all api_call (per vendor documentation)
  # ───────────────────────────────────────────────────────────────────────
  # Okta: https://developer.okta.com/docs/reference/api/event-types/
  # Every System Log entry is an API-level event.
  okta/okta:
    platforms: [okta]
    data_sources: [okta_system_log]
    event_types: [api_call]
  okta:
    platforms: [okta]
    data_sources: [okta_system_log]
    event_types: [api_call]

  # GitHub / GitLab audit logs — API-driven admin events
  github/audit:
    platforms: [github]
    data_sources: [github_audit]
    event_types: [api_call]
  github:
    platforms: [github]
    data_sources: [github_audit]
    event_types: [api_call]
  gitlab:
    platforms: [gitlab]
    data_sources: [gitlab_audit]
    event_types: [api_call]

  # ───────────────────────────────────────────────────────────────────────
  # Network appliances
  # ───────────────────────────────────────────────────────────────────────
  cisco/aaa:
    platforms: [network_appliance]
    data_sources: [cisco_aaa]
    event_types: [authentication]
  cisco:
    platforms: [network_appliance]
    data_sources: [cisco_firewall]
    event_types: [audit_event]
  fortinet:
    platforms: [network_appliance]
    data_sources: [fortinet_firewall]
    event_types: [network_connection]
  paloalto:
    platforms: [network_appliance]
    data_sources: [palo_alto_firewall]
    event_types: [network_connection]
  zeek:
    platforms: [network_appliance]
    data_sources: [zeek]
    event_types: [network_connection]

  # ───────────────────────────────────────────────────────────────────────
  # Container / Kubernetes
  # ───────────────────────────────────────────────────────────────────────
  kubernetes/audit:
    platforms: [kubernetes]
    data_sources: [kubernetes_audit]
    event_types: [api_call]
  kubernetes:
    platforms: [kubernetes]
    data_sources: [kubernetes_audit]
    event_types: [api_call]

  # ───────────────────────────────────────────────────────────────────────
  # product: "any" — Sigma rules that target multiple platforms via
  # log-source-agnostic event categories
  # ───────────────────────────────────────────────────────────────────────
  any/dns:
    platforms: [windows, linux, macos]
    data_sources: [dns_query_logs, sysmon, zeek]
    event_types: [dns_query]
  any/dns_query:
    platforms: [windows, linux, macos]
    data_sources: [dns_query_logs, sysmon, zeek]
    event_types: [dns_query]
  any/network_connection:
    platforms: [windows, linux, macos]
    data_sources: [zeek, sysmon]
    event_types: [network_connection]
  any/proxy:
    platforms: [network_appliance]
    data_sources: [proxy_logs]
    event_types: [http_request]
  any/webserver:
    platforms: [network_appliance]
    data_sources: [proxy_logs]
    event_types: [http_request]
  any/firewall:
    platforms: [network_appliance]
    data_sources: [palo_alto_firewall, fortinet_firewall, cisco_firewall]
    event_types: [network_connection]
  any:
    platforms: [cross_platform]
