# Sigma → canonical taxonomy mappings.
#
# Sigma rules carry a `logsource` block with three keys: product, service,
# category. The resolver tries the most specific compound key first and
# falls back to less specific ones.
#
# Key conventions:
#   product/service/category  ← most specific
#   product/service
#   product/category
#   product                   ← least specific (broad fallback)
#
# All keys are lowercase. All canonical values referenced here must be
# defined in `app/services/taxonomy/canonical.py`.

by_key:
  # ── Windows endpoint ──────────────────────────────────────────────────
  windows/process_creation:
    platforms: [windows]
    data_sources: [sysmon, windows_security_event_log]
    event_types: [process_creation]
