# Sigma -> canonical taxonomy mappings.
#
# Sigma rules carry a `logsource` block with three keys: product, service,
# category. The resolver tries the most specific compound key first and
# falls back to less specific ones.
#
# Key conventions:
#   product/service/category  <- most specific
#   product/service
#   product/category
#   product                   <- least specific (broad fallback)
#
# All keys are lowercase. All canonical values referenced here must be
# defined in `app/services/taxonomy/canonical.py`.
#
# Design principles (see docs/taxonomy.md):
#
# 1. No inference. If Sigma doesn't explicitly tell us the event type
#    (e.g. via `category: process_creation`), we do NOT guess from the
#    service channel. Windows `security` / `system` / `application`
#    channels contain many different event types; without a per-EventID
#    dictionary we classify them as the coarse `audit_event`.
#
# 2. Full granularity. When Sigma DOES give us a specific category
#    (e.g. `category: file_delete`), we preserve it as its own canonical
#    event_type. We do NOT collapse `file_delete`, `file_block_executable`,
#    `create_stream_hash` etc. into a generic `file_event` bucket —
#    detection engineers filter by these specific activities.
#
# 3. SaaS audit logs are `api_call`. Okta System Log, M365 Unified Audit,
#    GitHub Audit Log, GCP Audit, Entra ID Audit all record API-level
#    events at the architectural layer. Classifying them as `audit_event`
#    is technically accurate but less consistent; `api_call` matches how
#    we already tag AWS CloudTrail and Azure Activity.

by_key:
  # ───────────────────────────────────────────────────────────────────────
  # Windows — granular Sysmon categories (first, most specific)
  # ───────────────────────────────────────────────────────────────────────
  # Process activity
  windows/process_creation:
