    data_sources: [application_logs]
    event_types: [audit_event]

  # ═══════════════════════════════════════════════════════════════════════
  # BARE SERVICE/CATEGORY RULES (no product — format-agnostic detections)
  #
  # These rules appear in `rules/category/`, `rules/web/webserver_generic/`,
  # `rules/web/proxy_generic/`, and `rules/web/product/`. They have no
  # `product:` in the logsource and apply to any vendor's logs. The
  # resolver matches them via the bare service or category name.
  # ═══════════════════════════════════════════════════════════════════════

  # ── Bare service: webserver products (rules/web/product/) ────────────
  # Apache and Nginx rules have only `service:` (no product, no category)
  apache:
    platforms: [network_appliance]
    data_sources: [webserver_logs]
    event_types: [audit_event]
  nginx:
    platforms: [network_appliance]
    data_sources: [webserver_logs]
    event_types: [audit_event]

  # ── Bare category: generic detection patterns ────────────────────────
  webserver:
    platforms: [network_appliance]
    data_sources: [webserver_logs]
    event_types: [http_request]
  proxy:
    platforms: [network_appliance]
    data_sources: [proxy_logs]
    event_types: [http_request]
  dns:
    platforms: [network_appliance]
    data_sources: [dns_query_logs]
    event_types: [dns_query]
  antivirus:
    platforms: [cross_platform]
    data_sources: [antivirus_logs]
    event_types: [audit_event]
  database:
    platforms: [cross_platform]
    data_sources: [database_logs]
    event_types: [audit_event]
  firewall:
    platforms: [network_appliance]
    data_sources: [palo_alto_firewall, fortinet_firewall, cisco_firewall]
    event_types: [network_connection]
  # NetFlow is network-telemetry metadata (src/dst/bytes/protocol). Rules
  # like `service: netflow` with no product hit the bare-service lookup.
  netflow:
    platforms: [network_appliance]
    data_sources: [network_traffic_logs]
    event_types: [network_connection]

  # ── Qualys — vulnerability management / compliance scanner ──────────
  # Sigma has rules like Default Credentials Usage keyed only on
  # `product: qualys` with no service/category. Qualys produces its own
  # audit/event stream (scanner findings, config changes).
  qualys:
    platforms: [cross_platform]
    data_sources: [application_logs]
    event_types: [audit_event]

  # ═══════════════════════════════════════════════════════════════════════
  # product: "any" (Sigma cross-platform rules via log-agnostic categories)
  # ═══════════════════════════════════════════════════════════════════════
  any/dns:
    platforms: [cross_platform]
    event_types: [dns_query]
  any/dns_query:
    platforms: [cross_platform]
    event_types: [dns_query]
  any/network_connection:
    platforms: [cross_platform]
    event_types: [network_connection]
  any/proxy:
    platforms: [network_appliance]
    event_types: [http_request]
  any/webserver:
    platforms: [network_appliance]
    event_types: [http_request]
  any/firewall:
    platforms: [network_appliance]
    event_types: [network_connection]
  any:
    platforms: [cross_platform]
