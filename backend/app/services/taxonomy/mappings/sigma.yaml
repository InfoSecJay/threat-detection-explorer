# Sigma -> canonical taxonomy mappings.
#
# Based on a comprehensive catalog of the SigmaHQ repo (~3,100 rules,
# 125 unique product/service/category combinations). Every combination
# that appears in the live corpus is covered here.
#
# Key lookup order (most specific wins; see vendors/sigma.py):
#   product/service/category
#   product/service
#   product/category
#   product
#   service              (bare, for product-less SaaS like onelogin.events)
#   category             (bare, for format-agnostic rules like webserver)
#
# Design principles (see docs/taxonomy.md):
#
# 1. No inference for data_source when Sigma didn't give us a service.
#    If the rule has only `product: linux, category: process_creation`,
#    we return the platform and event_type explicitly but leave
#    data_source empty (resolves to [unknown]).
#
# 2. Full granularity on event_type. Sigma Sysmon categories map 1:1
#    (file_delete != file_event; create_remote_thread != process_creation).
#
# 3. SaaS audit logs are api_call. Okta, M365 audit, GitHub, Bitbucket,
#    Google Workspace, Entra audit — all REST API event streams.
#    Signin logs (Entra signin, Azure signin) stay `authentication`
#    because the feed is exclusively sign-in activity.

