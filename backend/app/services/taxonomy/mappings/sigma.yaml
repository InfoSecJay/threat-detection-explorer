  # NETWORK APPLIANCES
  #
  # Full coverage of rules/network/ (Cisco, FortiGate, Huawei, Juniper,
  # Zeek). Each vendor's product name matches what Sigma uses in the
  # logsource (e.g. `fortigate` not `fortinet`).
  # ═══════════════════════════════════════════════════════════════════════

  # ── Cisco (14 rules: aaa=12, bgp=1, ldp=1) ──────────────────────────
  cisco/aaa:
    platforms: [network_appliance]
    data_sources: [cisco_aaa]
    event_types: [authentication]
  cisco/bgp:
    platforms: [network_appliance]
    data_sources: [cisco_firewall]
    event_types: [network_connection]
  cisco/ldp:
    platforms: [network_appliance]
    data_sources: [cisco_firewall]
    event_types: [network_connection]
  cisco:
    platforms: [network_appliance]
    data_sources: [cisco_firewall]
    event_types: [audit_event]

  # ── FortiGate (7 rules: product=fortigate, service=event) ───────────
  # Note: Sigma uses `fortigate` as the product name, not `fortinet`.
  fortigate/event:
    platforms: [network_appliance]
    data_sources: [fortinet_firewall]
    event_types: [audit_event]
  fortigate:
    platforms: [network_appliance]
    data_sources: [fortinet_firewall]
    event_types: [audit_event]

  # ── FortiOS / SSL VPN daemon (CVE-2022-42475 rule) ──────────────────
  # Sigma uses `fortios` (the firmware, not the appliance) as a separate
  # product name. SSL VPN daemon logs are network-appliance authentication.
  fortios/sslvpnd:
    platforms: [network_appliance]
    data_sources: [fortinet_firewall]
    event_types: [authentication]
  fortios:
    platforms: [network_appliance]
    data_sources: [fortinet_firewall]
    event_types: [audit_event]

