# Splunk Security Content → canonical taxonomy mappings.
#
# Splunk's `data_source` field is a list of free-form labels like
# "Sysmon EventID 10", "ASL AWS CloudTrail", "Cisco Duo Activity". They
# include version/event-id details that we don't care about, so the
# resolver does prefix/substring matching against the keys below.
#
# Keys are lowercase. They're matched against the lowercased data_source
# label using both exact match and substring containment.

data_source_labels:
  # ── Sysmon (multiple event IDs) ───────────────────────────────────────
  "sysmon eventid 1":
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [process_creation]
  "sysmon eventid 3":
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [network_connection]
  "sysmon eventid 7":
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [image_load]
  "sysmon eventid 10":
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [process_creation]
  "sysmon eventid 11":
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [file_event]
  "sysmon eventid 12":
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [registry_event]
  "sysmon eventid 13":
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [registry_event]
  "sysmon eventid 22":
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [dns_query]
  "sysmon":  # generic sysmon prefix match
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [process_creation]
  # ── Windows event logs ────────────────────────────────────────────────
  "windows event log security":
    platforms: [windows]
    data_sources: [windows_security_event_log]
    event_types: [authentication, audit_event]
  "windows event log system":
    platforms: [windows]
    data_sources: [windows_security_event_log]
    event_types: [audit_event]
  "windows event log application":
    platforms: [windows]
    data_sources: [windows_security_event_log]
    event_types: [audit_event]
  "windows event log":
    platforms: [windows]
    data_sources: [windows_security_event_log]
    event_types: [audit_event]
  "windows powershell":
    platforms: [windows]
    data_sources: [windows_powershell]
    event_types: [process_creation]
  "powershell":
    platforms: [windows]
    data_sources: [windows_powershell]
    event_types: [process_creation]
  "windows defender":
    platforms: [windows]
    data_sources: [windows_defender_event_log]
    event_types: [audit_event]
  # ── AWS / Cloud ───────────────────────────────────────────────────────
  "asl aws cloudtrail":  # Amazon Security Lake CloudTrail (OCSF schema)
    platforms: [aws]
    data_sources: [aws_security_lake, aws_cloudtrail]
    event_types: [api_call]
  "aws cloudtrail":
    platforms: [aws]
    data_sources: [aws_cloudtrail]
    event_types: [api_call]
  "amazon security lake":
    platforms: [aws]
    data_sources: [aws_security_lake]
    event_types: [api_call]
  "aws security hub":
    platforms: [aws]
    data_sources: [aws_security_hub]
    event_types: [audit_event]
  "asl":  # Amazon Security Lake (generic)
    platforms: [aws]
    data_sources: [aws_security_lake]
    event_types: [api_call]
  "azure activity":
    platforms: [azure]
    data_sources: [azure_activity]
    event_types: [api_call]
  "azure monitor activity":
    platforms: [azure]
    data_sources: [azure_activity]
    event_types: [api_call]
  # Entra ID / Azure AD variants. Splunk's data_source labels are verbose
  # and inconsistent ("azure ad" vs "azure active directory" vs more
  # specific per-event variants). Exact-match-first means each must be
  # listed explicitly. Audit activity (member/role/consent/service
  # principal/app) goes to `entra_id_audit`; sign-in events to
  # `entra_id_signin`.
  "azure ad":
    platforms: [azure]
    data_sources: [entra_id_signin]
    event_types: [authentication]
  "azure active directory":
    platforms: [azure]
    data_sources: [entra_id_signin, entra_id_audit]
    event_types: [authentication, audit_event]
  "azure active directory sign-in activity":
    platforms: [azure]
    data_sources: [entra_id_signin]
    event_types: [authentication]
  "azure active directory add member to role":
    platforms: [azure]
    data_sources: [entra_id_audit]
    event_types: [audit_event]
  "azure active directory consent to application":
    platforms: [azure]
    data_sources: [entra_id_audit]
    event_types: [audit_event]
  "azure active directory add service principal":
    platforms: [azure]
    data_sources: [entra_id_audit]
    event_types: [audit_event]
  "azure active directory update application":
    platforms: [azure]
    data_sources: [entra_id_audit]
    event_types: [audit_event]
  "o365":
    platforms: [microsoft_365]
    data_sources: [m365_audit]
    event_types: [audit_event]
  "office 365":
    platforms: [microsoft_365]
    data_sources: [m365_audit]
    event_types: [audit_event]
  "google workspace":
    platforms: [google_workspace]
    data_sources: [google_workspace_audit]
    event_types: [audit_event]
  "g suite gmail":
    platforms: [google_workspace]
    data_sources: [google_workspace_audit]
    event_types: [email_message]
  "g suite drive":
    platforms: [google_workspace]
    data_sources: [google_workspace_audit]
    event_types: [audit_event]
  "gcp":
    platforms: [gcp]
    data_sources: [gcp_audit]
    event_types: [api_call]
  # ── Identity ─────────────────────────────────────────────────────────
  "okta":
    platforms: [okta]
    data_sources: [okta_system_log]
    event_types: [authentication]
  "cisco duo":
    platforms: [duo]
    data_sources: [duo_activity]
    event_types: [authentication]
  "duo":
    platforms: [duo]
    data_sources: [duo_activity]
    event_types: [authentication]
  # ── Linux ────────────────────────────────────────────────────────────
  "linux audit":
    platforms: [linux]
    data_sources: [auditd]
    event_types: [process_creation, audit_event]
  "auditd":
    platforms: [linux]
    data_sources: [auditd]
    event_types: [process_creation, audit_event]
  "linux":
    platforms: [linux]
    data_sources: [linux_syslog]
    event_types: [audit_event]
  # ── Network ──────────────────────────────────────────────────────────
  "zeek":
    platforms: [network_appliance]
    data_sources: [zeek]
    event_types: [network_connection, dns_query]
  "suricata":
    platforms: [network_appliance]
    data_sources: [suricata]
    event_types: [network_connection]
  "palo alto":
    platforms: [network_appliance]
    data_sources: [palo_alto_firewall]
    event_types: [network_connection]
  "stream":  # Splunk Stream (network analyzer)
    platforms: [network_appliance]
    data_sources: [zeek]
    event_types: [network_connection]
  # Cisco Secure Firewall (née Firepower / FTD — Threat Defense). Multiple
  # event types surface as distinct labels; each resolves to the same
  # firewall data_source with an appropriate event_type.
  "cisco secure firewall threat defense intrusion event":
    platforms: [network_appliance]
    data_sources: [cisco_firewall]
    event_types: [network_connection]
  "cisco secure firewall threat defense connection event":
    platforms: [network_appliance]
    data_sources: [cisco_firewall]
    event_types: [network_connection]
  "cisco secure firewall threat defense file event":
    platforms: [network_appliance]
    data_sources: [cisco_firewall]
    event_types: [file_event]
  "cisco asa":
    platforms: [network_appliance]
    data_sources: [cisco_firewall]
    event_types: [network_connection]
  "cisco ios":
    platforms: [network_appliance]
    data_sources: [cisco_firewall]
    event_types: [audit_event]
  "cisco sd-wan":
    platforms: [network_appliance]
    data_sources: [cisco_firewall]
    event_types: [network_connection]
  "nginx access":
    platforms: [network_appliance]
    data_sources: [webserver_logs]
    event_types: [http_request]
  # VMware ESXi ships audit events over syslog. Not OS-specific telemetry
  # so platform=cross_platform (hypervisor layer) + linux_syslog format.
  "vmware esxi syslog":
    platforms: [cross_platform]
    data_sources: [linux_syslog]
    event_types: [audit_event]
  # ── Container ────────────────────────────────────────────────────────
  "kubernetes":
    platforms: [kubernetes]
    data_sources: [kubernetes_audit]
    event_types: [audit_event]
  # ── EDR ──────────────────────────────────────────────────────────────
  "crowdstrike":
    platforms: [windows, linux, macos]
    data_sources: [crowdstrike_fdr]
    event_types: [process_creation, network_connection]
  "carbon black":
    platforms: [windows]
    data_sources: [carbon_black]
    event_types: [process_creation, network_connection]
  "osquery":
    platforms: [windows, linux, macos]
    data_sources: [osquery]
    event_types: [audit_event]
  # ── SaaS / DevOps ────────────────────────────────────────────────────
  "github enterprise audit":
    platforms: [github]
    data_sources: [github_audit]
    event_types: [audit_event]
  "github organizations audit":
    platforms: [github]
    data_sources: [github_audit]
    event_types: [audit_event]
  "circleci":
    platforms: [cross_platform]
    data_sources: [application_logs]
    event_types: [audit_event]
  # ── M365 / Copilot ───────────────────────────────────────────────────
  "m365 exported ediscovery prompts":
    platforms: [microsoft_365]
    data_sources: [m365_audit]
    event_types: [audit_event]
  "m365 copilot":
    platforms: [microsoft_365]
    data_sources: [m365_audit]
    event_types: [api_call]
  # ── LLM service logs ─────────────────────────────────────────────────
  "ollama server":
    platforms: [llm]
    data_sources: [llm_service_logs]
    event_types: [api_call]
  "mcp server":  # Model Context Protocol
    platforms: [llm]
    data_sources: [llm_service_logs]
    event_types: [api_call]
  # ── Misc apps / identity / file-transfer ─────────────────────────────
  "crushftp":
    platforms: [cross_platform]
    data_sources: [application_logs]
    event_types: [audit_event]
  "pingid":
    platforms: [cross_platform]
    data_sources: [application_logs]
    event_types: [authentication]
  # Windows AD Monitor (admon) — directory-object audit feed
  "windows active directory admon":
    platforms: [windows]
    data_sources: [windows_security_event_log]
    event_types: [audit_event]

# Coarse fallback from `tags.security_domain`. Helpful when no explicit
# data_source label was set. Note: we don't populate data_sources from
# this — the labels are too coarse to be useful as a data_source.
security_domain:
  endpoint:
    platforms: [windows]
    event_types: [process_creation]
  network:
    platforms: [network_appliance]
    event_types: [network_connection]
  identity:
    event_types: [authentication]
  cloud:
    platforms: [aws]
    event_types: [api_call]
  access:
    event_types: [authentication]

# Last-resort: if no data_source label and no security_domain match,
# scan the search query for these keywords to fill in any still-empty
# dimension (platforms / data_sources / event_types). Each entry can
# contribute to multiple dimensions. Keyword matches are checked via
# substring so the query `| from datamodel=Network_Resolution` hits
# both `datamodel=network_resolution` and `network_resolution`.
search_keywords:
  # ── Endpoint / Windows ───────────────────────────────────────────────
  "process_name":
    event_types: [process_creation]
  "wineventlog":
    platforms: [windows]
    data_sources: [windows_security_event_log]
    event_types: [audit_event]
  "tstats":
    event_types: [process_creation]
  "datamodel=endpoint.processes":
    platforms: [windows]
    event_types: [process_creation]
  "datamodel=network_resolution":
    event_types: [dns_query]
  "datamodel=authentication":
    event_types: [authentication]
  "logon":
    event_types: [authentication]
  # ── Zeek / Suricata network analyzers (search text often references
  # the Zeek log type like `zeek:ssl`, `zeek:x509`, `zeek:conn`, etc.) ─
  "zeek:":
    platforms: [network_appliance]
    data_sources: [zeek]
    event_types: [network_connection]
  "zeek_":
    platforms: [network_appliance]
    data_sources: [zeek]
    event_types: [network_connection]
  "suricata":
    platforms: [network_appliance]
    data_sources: [suricata]
    event_types: [network_connection]
  # ── osquery (endpoint monitoring) — shows up as `index=osquery` etc. ─
  "osquery":
    platforms: [windows, linux, macos]
    data_sources: [osquery]
    event_types: [audit_event]
  # ── Cloud platforms (when search references their API/audit tables) ─
  "cloudtrail":
    platforms: [aws]
    data_sources: [aws_cloudtrail]
    event_types: [api_call]
  "aws cloudtrail":
    platforms: [aws]
    data_sources: [aws_cloudtrail]
    event_types: [api_call]
  "azureactivity":
    platforms: [azure]
    data_sources: [azure_activity]
    event_types: [api_call]
  "datamodel=cloud":
    platforms: [aws]
    event_types: [api_call]
