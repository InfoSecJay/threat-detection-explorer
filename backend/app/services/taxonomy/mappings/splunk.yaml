  windows_security:
    platforms: [windows]
    data_sources: [windows_security_event_log]
  powershell:
    platforms: [windows]
    data_sources: [windows_powershell]
    event_types: [process_creation]
    authoritative: true  # PowerShell ScriptBlock is always process-adjacent
  windows_powershell:
    platforms: [windows]
    data_sources: [windows_powershell]
    event_types: [process_creation]
    authoritative: true
  windefend:
