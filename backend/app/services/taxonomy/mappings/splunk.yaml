# Splunk Security Content → canonical taxonomy mappings.
#
# Tiered model (see vendors/splunk.py for full docs):
#
#   1. datamodels   — authoritative event_type (`datamodel=Endpoint.Processes` IS process_creation)
#   2. macros       — backtick shortcuts (`okta`, `sysmon`, `cloudtrail`, ...)
#                     flagged `authoritative: true` override lower tiers
#   3. data_source_labels — coarse feed names from the rule's `data_source`
#                     field; capability-level for event_types
#   4. security_domain    — coarse platform/event hint
#   5. search_keywords    — last-resort substring scan of the SPL text
#
# Keys are lowercase. data_source labels support prefix/substring match
# (the labels in Splunk rules carry version numbers we don't want to
# enumerate). Datamodels / macros / keywords are exact match on the
# parsed identifier.

# ─────────────────────────────────────────────────────────────────────────
# TIER 1 — DATAMODELS (authoritative event_type)
# Matched against `datamodel=X.Y` and `from datamodel X.Y` in the search.
# If the full `root.node` key isn't in the map, the resolver falls back
# to the top-level root (e.g. `web.web` → `web`).
# ─────────────────────────────────────────────────────────────────────────
datamodels:
  endpoint.processes:
    platforms: [windows, linux, macos]
    data_sources: [sysmon, windows_security_event_log, crowdstrike_fdr, carbon_black, elastic_defend]
    event_types: [process_creation]
  endpoint.registry:
    platforms: [windows]
    data_sources: [sysmon, windows_security_event_log]
    event_types: [registry_event]
  endpoint.filesystem:
    platforms: [windows, linux, macos]
    data_sources: [sysmon, elastic_defend, crowdstrike_fdr]
    event_types: [file_event]
  endpoint.services:
    platforms: [windows]
    data_sources: [windows_security_event_log]
    event_types: [audit_event]
  endpoint.ports:
    platforms: [windows, linux, macos]
    data_sources: [sysmon]
    event_types: [network_connection]
  endpoint:  # top-level fallback
    platforms: [windows, linux, macos]
    data_sources: [sysmon, windows_security_event_log, elastic_defend]
    event_types: [process_creation]
  network_resolution:
    platforms: [network_appliance, windows]
    data_sources: [sysmon, zeek, dns_query_logs]
    event_types: [dns_query]
  network_traffic:
    platforms: [network_appliance]
    data_sources: [zeek, suricata, palo_alto_firewall]
    event_types: [network_connection]
  network_sessions:
    platforms: [network_appliance]
    data_sources: [zeek, suricata]
    event_types: [network_connection]
  authentication:
    data_sources: [windows_security_event_log, okta_system_log, duo_activity]
    event_types: [authentication]
  web:
    platforms: [network_appliance]
    data_sources: [webserver_logs, zeek, suricata, proxy_logs]
    event_types: [http_request]
  web.web:  # alias for the Splunk Web datamodel root
    platforms: [network_appliance]
    data_sources: [webserver_logs, zeek, suricata, proxy_logs]
    event_types: [http_request]
  change:
    event_types: [audit_event]
  # Risk datamodel aggregates risk scores across other rules. It's a
  # SIEM-internal abstraction (Splunk's Risk-Based Alerting), not a
  # raw feed. Rules `tstats ... datamodel=Risk` correlate scored events
  # into higher-confidence detections — that's alert_correlation territory.
  risk:
    platforms: [cross_platform]
    data_sources: [siem_alert]
    event_types: [alert_correlation]
  updates:
    platforms: [windows, linux, macos]
    event_types: [audit_event]
  ueba:
    platforms: [cross_platform]
    data_sources: [siem_alert]
    event_types: [audit_event]
  email:
    platforms: [email]
    data_sources: [email_message_metadata]
    event_types: [email_message]
  malware:
    data_sources: [antivirus_logs]
    event_types: [audit_event]
  intrusion_detection:
    platforms: [network_appliance]
    data_sources: [suricata, snort]
    event_types: [network_connection]
  vulnerabilities:
    event_types: [audit_event]

# ─────────────────────────────────────────────────────────────────────────
# TIER 2 — MACROS (backtick-wrapped shortcuts)
# `authoritative: true` means the macro IS a specific event-type signal
# (e.g. `okta` always means authentication events). Generic macros like
# `sysmon` (any of 27 event codes) stay non-authoritative and only
# contribute capability — the event_type comes from a datamodel / query
# keyword.
# ─────────────────────────────────────────────────────────────────────────
macros:
  # ── Endpoint (Windows) ────────────────────────────────────────────────
  sysmon:
    platforms: [windows]
    data_sources: [sysmon]
    # Intentionally no event_types — bare `sysmon` covers 27 event codes.
  wineventlog_security:
    platforms: [windows]
    data_sources: [windows_security_event_log]
