# ─────────────────────────────────────────────────────────────────────────
# TIER 3 — DATA_SOURCE FIELD LABELS
# Splunk rule metadata carries `data_source: [...]` — the feeds the rule
# queries. These contribute platforms + data_sources freely; event_types
# here are capability-level (NOT authoritative — a coarse feed like
# "Windows Security Event Log" can produce dozens of event IDs).
# ─────────────────────────────────────────────────────────────────────────
data_source_labels:
  # ── Sysmon (per-event-ID) — authoritative in intent because the label
  # names the event code explicitly. Still stored here (not in macros)
  # because they come from the structured `data_source` field.
  "sysmon eventid 1":
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [process_creation]
  "sysmon eventid 3":
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [network_connection]
  "sysmon eventid 7":
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [image_load]
  "sysmon eventid 10":
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [process_creation]
  "sysmon eventid 11":
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [file_event]
  "sysmon eventid 12":
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [registry_event]
  "sysmon eventid 13":
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [registry_event]
  "sysmon eventid 22":
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [dns_query]
  "sysmon":  # bare prefix match
    platforms: [windows]
    data_sources: [sysmon]
    # no event_types — sysmon covers many event IDs

  # ── Windows event logs (capability only for event_type) ──────────────
