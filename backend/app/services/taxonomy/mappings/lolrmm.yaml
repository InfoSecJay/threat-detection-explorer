# LOLRMM -> canonical taxonomy mappings.
#
# LOLRMM uses Sigma format. All LOLRMM rules are about RMM (Remote
# Monitoring & Management) tool detection, predominantly Windows with
# some cross-platform rules using `product: any` for DNS / network
# detection that isn't OS-specific.
#
# Mapping rules follow the same design principles as sigma.yaml:
#   - No inference (if Sigma doesn't tell us the event type, don't guess)
#   - Full granularity (preserve Sigma's specific category names)

by_key:
  # ── Windows Sysmon categories ──────────────────────────────────────────
  windows/process_creation:
    platforms: [windows]
    data_sources: [sysmon, windows_security_event_log]
    event_types: [process_creation]
  windows/network_connection:
    platforms: [windows]
    data_sources: [sysmon, windows_security_event_log]
    event_types: [network_connection]
  windows/file_event:
    platforms: [windows]
    data_sources: [sysmon, windows_security_event_log]
    event_types: [file_event]
  windows/registry_event:
    platforms: [windows]
    data_sources: [sysmon, windows_security_event_log]
    event_types: [registry_event]
  windows/dns_query:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [dns_query]
  windows/image_load:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [image_load]
  windows/pipe_created:
    platforms: [windows]
    data_sources: [sysmon]
    event_types: [pipe_created]
  windows:
    platforms: [windows]
    data_sources: [windows_security_event_log]

  # ── Linux (category-only; no data_source inference — same as sigma.yaml)
  linux/process_creation:
    platforms: [linux]
    event_types: [process_creation]
  linux/network_connection:
    platforms: [linux]
    event_types: [network_connection]
  linux/file_event:
    platforms: [linux]
    event_types: [file_event]
  linux/dns_query:
    platforms: [linux]
    event_types: [dns_query]
  linux:
    platforms: [linux]

  # ── macOS (category-only; no data_source inference) ──────────────────
  macos/process_creation:
    platforms: [macos]
    event_types: [process_creation]
  macos:
    platforms: [macos]

  # ── product: "any" (LOLRMM uses for cross-platform detection via DNS
  # or network flows). Platform + event_type only; no data_source.
  any/dns:
    platforms: [cross_platform]
    data_sources: [dns_query_logs]
    event_types: [dns_query]
  any/dns_query:
    platforms: [cross_platform]
    data_sources: [dns_query_logs]
    event_types: [dns_query]
  any/network_connection:
    platforms: [cross_platform]
    event_types: [network_connection]
  any/proxy:
    platforms: [network_appliance]
    event_types: [http_request]
  any/webserver:
    platforms: [network_appliance]
    event_types: [http_request]
  any:
    platforms: [cross_platform]

# Intentionally empty — the mapping entries above carry all the signal.
always_includes:
  data_sources: []
  event_types: []
