[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-detection-explorer"
version = "0.1.0"
description = "A web application for exploring and comparing security detection rules across vendors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.0",
    "toml>=0.10.2",
    "gitpython>=3.1.0",
    "httpx>=0.26.0",
    "pillow>=10.1.0",
    "python-multipart>=0.0.6",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "tzdata>=2024.1",
    "apscheduler>=3.10.0",
    "luqum>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
# `vendored/` sits next to `app/` in the flat layout; without an
# explicit include, setuptools refuses to build ("Multiple top-level
# packages discovered"). Only `app` is the distributable package.
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
